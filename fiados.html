<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" href="favicon-48.png"><!-- logo nuevo VAO -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SmartPOS · VAO Sistemas · Fiados</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
    --oliva:       #1E88E5;
    --oliva-dark:  #0D47A1;
    --oliva-deep:  #0A2472;
    --oliva-light: #E3F2FD;
    --naranja:     #FF8C00;
    --naranja-dark:#E65100;
    --verde:       #2E7D32;
    --verde-light: #E8F5E9;
    --arena:       #F5F7FA;
    --arena-dark:  #E8ECF0;
    --blanco:      #FFFFFF;
    --gris:        #607080;
    --texto:       #111827;
    --rojo:        #D32F2F;
    --rojo-light:  #FFEBEE;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'DM Sans',sans-serif; background:var(--blanco); color:var(--texto); min-height:100dvh; }

.header {
    background:linear-gradient(135deg,var(--oliva-deep),var(--oliva-dark),var(--oliva));
    padding:12px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 2px 12px rgba(13,71,161,0.35); position:sticky; top:0; z-index:100;
}
.header-titulo { font-family:'Playfair Display',serif; color:white; font-size:1rem; font-weight:900; line-height:1.1; }
.header-sub { color:rgba(255,255,255,0.7); font-size:0.65rem; letter-spacing:2px; text-transform:uppercase; }
.btn-volver { margin-left:auto; background:rgba(255,255,255,0.15); border:none; color:white; border-radius:20px; padding:6px 14px; font-size:0.78rem; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-flex; align-items:center; }
.btn-back-mini { background:rgba(255,255,255,0.15); border:none; color:white; border-radius:20px; padding:6px 14px; font-size:0.78rem; font-weight:700; cursor:pointer; font-family:inherit; }

.loading { text-align:center; padding:60px 20px; color:var(--gris); }
.spinner { width:36px; height:36px; border:3px solid var(--oliva-light); border-top-color:var(--oliva); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 12px; }
@keyframes spin { to { transform:rotate(360deg); } }
.empty { text-align:center; padding:40px 20px; color:#aaa; }
/* V6: ficha y cobros recientes */
.ficha { background:#fff; border-radius:14px; padding:12px 14px; margin:10px 0; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.ficha-top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.ficha-estado { font-size:0.78rem; font-weight:800; padding:3px 9px; border-radius:20px; }
.ficha-estado.on { background:#e8f5e9; color:#2e7d32; } .ficha-estado.off { background:#eceff1; color:#546e7a; }
.ficha-btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.ficha-btns button { border:none; border-radius:20px; padding:7px 12px; font-weight:800; font-size:0.8rem; cursor:pointer; }
.btn-ficha-gris { background:#eceff1; color:#37474f; } .btn-ficha-rojo { background:#ffebee; color:#c62828; } .btn-ficha-verde { background:#e8f5e9; color:#2e7d32; }
.ficha-msg { font-size:0.82rem; margin-top:8px; padding:8px 10px; border-radius:10px; display:none; line-height:1.35; }
.ficha-msg.ok { display:block; background:#e8f5e9; color:#1b5e20; } .ficha-msg.aviso { display:block; background:#fff3e0; color:#e65100; } .ficha-msg.error { display:block; background:#ffebee; color:#b71c1c; }
.mov { border-top:1px solid #f0f0f0; padding:8px 0; font-size:0.85rem; }
.mov-top { display:flex; justify-content:space-between; gap:8px; } .mov-meta { color:#888; font-size:0.75rem; margin-top:2px; }
.mov.anulado .mov-top { text-decoration:line-through; color:#999; }
.mov-anular { margin-top:6px; display:flex; gap:6px; } .mov-anular input { flex:1; min-width:0; padding:7px 9px; border:1.5px solid #e0e0e0; border-radius:10px; font-size:0.85rem; }
.mov-anular button, .btn-mov { border:none; border-radius:16px; padding:6px 10px; font-weight:800; font-size:0.75rem; cursor:pointer; background:#ffebee; color:#c62828; }

.seccion { padding:14px 14px 90px; }

.resumen-global { background:linear-gradient(135deg,var(--oliva-deep),var(--oliva)); border-radius:16px; padding:16px; margin-bottom:14px; color:white; }
.res-label { font-size:0.72rem; opacity:0.75; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.res-total { font-family:'Playfair Display',serif; font-size:2rem; font-weight:900; line-height:1; }
.res-sub { font-size:0.8rem; opacity:0.85; margin-top:6px; }

.cli-card {
    background:white; border:1px solid var(--arena-dark); border-radius:14px;
    padding:13px 15px; margin-bottom:9px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    transition:border-color 0.15s;
}
.cli-card:active { border-color:var(--oliva); }
.cli-card.vencido { border-left:4px solid var(--rojo); }
.cli-nombre { font-weight:700; font-size:0.92rem; color:var(--texto); }
.cli-meta { font-size:0.72rem; color:var(--gris); margin-top:2px; }
.cli-monto { font-weight:900; font-size:1rem; color:var(--oliva-dark); text-align:right; white-space:nowrap; }
.cli-badge { display:inline-block; font-size:0.65rem; font-weight:700; color:var(--rojo); background:var(--rojo-light); border-radius:8px; padding:1px 6px; margin-top:3px; }

.fiado-card {
    background:white; border:1px solid var(--arena-dark); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer;
}
.fiado-card.vencido { border-left:4px solid var(--rojo); }
.fiado-card.abonado { border-left:4px solid var(--naranja); }
.fiado-top { display:flex; justify-content:space-between; align-items:baseline; }
.fiado-desc { font-weight:700; font-size:0.85rem; color:var(--texto); }
.fiado-saldo { font-weight:900; font-size:0.95rem; color:var(--oliva-dark); }
.fiado-meta { font-size:0.72rem; color:var(--gris); margin-top:3px; }
.fiado-estado { font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
.fiado-estado.pendiente { color:var(--gris); }
.fiado-estado.vencido { color:var(--rojo); }
.fiado-estado.abonado { color:var(--naranja-dark); }

.btn-primario {
    width:100%; padding:13px; border:none; border-radius:12px;
    background:var(--oliva-dark); color:white; font-weight:700; font-size:0.9rem;
    cursor:pointer; font-family:inherit;
}
.btn-primario:disabled { opacity:0.6; }
.btn-secundario {
    width:100%; padding:11px; border:1px solid var(--arena-dark); border-radius:12px;
    background:white; color:var(--gris); font-weight:700; font-size:0.85rem;
    cursor:pointer; font-family:inherit; margin-top:8px;
}

.form-grupo { margin-bottom:14px; }
.form-label { display:block; font-size:0.72rem; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
.form-input {
    width:100%; padding:11px 12px; border:1.5px solid var(--arena-dark); border-radius:10px;
    font-size:0.95rem; font-family:inherit; color:var(--texto);
}
.form-input:focus { outline:none; border-color:var(--oliva); }

.metodos-pago { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.btn-metodo {
    flex:1; min-width:calc(50% - 4px); padding:10px 8px; border:2px solid var(--arena-dark);
    border-radius:12px; background:white; font-size:0.8rem; font-weight:700; cursor:pointer;
    font-family:inherit; color:var(--gris);
}
.btn-metodo.activo { border-color:var(--oliva); background:var(--oliva-light); color:var(--oliva-dark); }

.modal-bg {
    position:fixed; inset:0; background:rgba(10,36,114,0.55); z-index:1000;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.2s;
}
.modal-bg.open { opacity:1; pointer-events:auto; }
.modal-sheet {
    background:white; border-radius:20px 20px 0 0; width:100%; max-width:480px;
    max-height:85vh; overflow-y:auto; padding:20px; transform:translateY(20px); transition:transform 0.2s;
}
.modal-bg.open .modal-sheet { transform:translateY(0); }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.modal-titulo { font-family:'Playfair Display',serif; font-size:1.1rem; font-weight:700; color:var(--texto); }
.modal-cerrar { background:var(--arena); border:none; width:30px; height:30px; border-radius:50%; font-size:1rem; cursor:pointer; color:var(--gris); }

.comprobante-texto {
    background:var(--arena); border-radius:10px; padding:12px; font-size:0.82rem;
    white-space:pre-wrap; color:var(--texto); margin-bottom:14px; line-height:1.5;
}
.error-msg { color:var(--rojo); font-size:0.85rem; margin-bottom:10px; display:none; }
.toast {
    position:fixed; top:70px; left:50%; transform:translateX(-50%); background:#333; color:white;
    padding:8px 20px; border-radius:20px; font-size:0.85rem; font-weight:600; z-index:2000;
    opacity:0; transition:opacity 0.3s; pointer-events:none; white-space:nowrap;
}
.toast.visible { opacity:1; }
.toast.verde { background:var(--verde); }
.toast.rojo { background:var(--rojo); }
</style>
</head>
<body>

<div class="header">
    <img src="logo_oscuro.png" alt="VAO Sistemas" style="height:30px;width:auto;flex-shrink:0;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.35));">
    <div>
        <div class="header-titulo">VAO Sistemas</div>
        <div class="header-sub" id="headerSub">Fiados</div>
    </div>
    <button class="btn-back-mini" id="btnVolverDetalle" style="display:none;" onclick="volverALista()">← Clientes</button>
    <a href="pos.html?p=" class="btn-volver" id="btnVolverPos">Salir →</a>
</div>

<div id="appContent">
    <div class="loading"><div class="spinner"></div><div>Cargando fiados...</div></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL COBRO/ABONO -->
<div class="modal-bg" id="modalPago" onclick="if(event.target===this)cerrarModalPago()">
    <div class="modal-sheet">
        <div class="modal-header">
            <span class="modal-titulo">💰 Registrar pago</span>
            <button class="modal-cerrar" onclick="cerrarModalPago()">✕</button>
        </div>
        <div id="pagoInfo" style="font-size:0.85rem;color:var(--gris);margin-bottom:14px;"></div>
        <div id="pagoPendienteAviso" style="display:none;background:#FFF8E1;border:1px solid #FFE082;color:#795548;border-radius:10px;padding:8px 10px;font-size:0.8rem;margin-bottom:12px;">
            📡 Este pago se envió y no se confirmó. <b>Confirmar</b> lo reintenta con el mismo número: no se cobra dos veces.
            <button onclick="descartarPagoPendiente()" style="border:none;background:none;color:#C62828;font-weight:800;cursor:pointer;padding:4px 0 0;display:block;">🗑 Descartarlo</button>
        </div>
        <div class="form-grupo">
            <label class="form-label">Monto a pagar</label>
            <input type="number" class="form-input" id="pagoMonto" min="0">
            <div id="pagoNotaPlan" style="display:none;font-size:0.78rem;color:#6A1B9A;margin-top:4px;">Fiado sencillo (P1 Esencial): se cobra la deuda completa. Los pagos parciales están en P2 Gestión.</div>
        </div>
        <div class="form-grupo">
            <label class="form-label">Método de pago</label>
            <div class="metodos-pago">
                <button class="btn-metodo activo" id="metodoPago-efectivo" onclick="seleccionarMetodoPago('efectivo')">💵 Efectivo</button>
                <button class="btn-metodo" id="metodoPago-transferencia" onclick="seleccionarMetodoPago('transferencia')">🏦 Transferencia</button>
                <button class="btn-metodo" id="metodoPago-debito" onclick="seleccionarMetodoPago('debito')">💳 Débito</button>
                <button class="btn-metodo" id="metodoPago-qr_posnet" onclick="seleccionarMetodoPago('qr_posnet')">💳 QR / Posnet</button>
            </div>
        </div>
        <div class="error-msg" id="pagoError"></div>
        <button class="btn-primario" id="btnConfirmarPago" onclick="confirmarPago()">✅ Confirmar pago</button>
    </div>
</div>

<!-- MODAL COMPROBANTE -->
<div class="modal-bg" id="modalComprobante" onclick="if(event.target===this)cerrarComprobante()">
    <div class="modal-sheet">
        <div class="modal-header">
            <span class="modal-titulo">✅ Pago registrado</span>
            <button class="modal-cerrar" onclick="cerrarComprobante()">✕</button>
        </div>
        <div class="comprobante-texto" id="comprobanteTexto"></div>
        <button class="btn-primario" onclick="compartirComprobante()">📲 Compartir por WhatsApp</button>
        <button class="btn-secundario" onclick="copiarComprobante()">📋 Copiar texto</button>
        <div id="copiadoMsg" style="display:none;text-align:center;font-size:0.78rem;color:var(--verde);margin-top:8px;">Copiado ✅</div>
    </div>
</div>

<script>
const APP_VERSION = 7; // V7.1 (v045.2): WhatsApp abre primero WhatsApp Business · V7 (v043): según el plan — P1 Esencial = fiado sencillo (se cobra la deuda completa; sin pagos parciales, ficha ni cobros recientes); P2 Gestión = gestión completa. Lo decide el servidor · V6: ficha del cliente (desactivar, reactivar, eliminar sin historial) y 📜 Cobros recientes con Anular (motivo obligatorio, sin duplicar) · V5: junta en una tarjeta al mismo cliente aunque cambien tildes, mayúsculas o espacios (motor v040.6)
const API_URL = 'https://script.google.com/macros/s/AKfycbzuRgk0h-gd5OXdZ3Q2Dw2Kudx8V7jY6ZwhuWvfg8JYfbU1mr2SU_K3zuFriRDRyUAU9A/exec';

// Mismo esquema seguro que ya usan pos.html y reportes.html — sin sesión
// propia: PREFIJO por querystring + token que pos.html ya guardó en
// localStorage al loguearse (vao_token_<PREFIJO>).
const PREFIJO = (new URLSearchParams(window.location.search).get('p') || '').toUpperCase();
const TOKEN_KEY = 'vao_token_' + PREFIJO;
function _tokenActual() { return localStorage.getItem(TOKEN_KEY) || ''; }

document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('headerSub').textContent = 'Fiados v' + APP_VERSION;
    var btnVolver = document.getElementById('btnVolverPos');
    if (btnVolver) btnVolver.href = 'pos.html?p=' + PREFIJO;
});

async function _api(action, data) {
    const url = API_URL + '?action=' + action + '&prefijo=' + PREFIJO +
        '&data=' + encodeURIComponent(JSON.stringify(Object.assign({ token: _tokenActual() }, data || {})));
    const r = await fetch(url, { redirect: 'follow' });
    return r.json();
}

function toast(msg, tipo) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast visible' + (tipo ? ' ' + tipo : '');
    setTimeout(() => { t.className = 'toast'; }, 2600);
}

function fmt(n) { return '$' + Math.round(n || 0).toLocaleString('es-AR'); }

let todosFiados = [];      // último resultado de getFiados, sin filtrar
let clienteActual = null;  // { cliente, telefono }
let fiadosCliente = [];    // último resultado de getFiadosCliente para el cliente abierto
let fiadoSeleccionado = null;
let metodoPagoActual = 'efectivo';
let ultimoComprobante = '';

// ========== ARRANQUE ==========
// V7 (v043): gestión completa de fiados (P2) o fiado sencillo (P1). Con un servidor anterior: gestión completa, como V6.
let GESTION_FIADOS = true;
async function leerPlanFiados() {
    try { const c = await _api('getConfig', {}); if (c && c.prestaciones && c.prestaciones.modulos && c.prestaciones.modulos.extra_fiados_gestion === false) GESTION_FIADOS = false; } catch (e) {}
}
async function init() {
    if (!PREFIJO || !_tokenActual()) {
        document.getElementById('appContent').innerHTML =
            '<div class="loading" style="color:var(--rojo);">❌ Sesión no encontrada. Volvé a entrar desde el POS.</div>';
        return;
    }
    await leerPlanFiados(); // V7
    await cargarListaClientes();
    verificarPagoPendiente(); // V2
}

async function cargarListaClientes() {
    document.getElementById('btnVolverDetalle').style.display = 'none';
    document.getElementById('appContent').innerHTML =
        '<div class="loading"><div class="spinner"></div><div>Cargando fiados...</div></div>';
    try {
        const data = await _api('getFiados');
        if (data.error) {
            document.getElementById('appContent').innerHTML =
                '<div class="loading" style="color:var(--rojo);">❌ ' + data.error + '</div>';
            return;
        }
        todosFiados = data.fiados || [];
        renderListaClientes();
    } catch (e) {
        document.getElementById('appContent').innerHTML =
            '<div class="loading" style="color:var(--rojo);">❌ Error al cargar. Verificá la conexión.</div>';
    }
}

// Agrupa los fiados pendientes/vencidos por cliente — mismo criterio simple
// que ya se usa en el resto del ecosistema (agrupar en el frontend a partir
// de un único listado), sin pedirle al backend nada que hoy no tenga.
// V5: clave para comparar nombres (sin tildes, espacios repetidos juntos, mayúsculas).
// Igual que _normCliente_ del motor v040.6 y _normNomCli de Copihue.
function _normCliente(n) { return String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toUpperCase(); }

function agruparPorCliente(fiados) {
    const map = {};
    fiados.forEach(f => {
        if (f.estado === 'PAGADO') return;
        const key = _normCliente(f.cliente); // V5: misma regla que el motor v040.6
        if (!key) return;
        if (!map[key]) map[key] = { cliente: f.cliente, telefono: f.telefono, total: 0, cant: 0, vencidos: 0 };
        map[key].total += f.total;
        map[key].cant++;
        if (f.estado === 'VENCIDO') map[key].vencidos++;
        if (!map[key].telefono && f.telefono) map[key].telefono = f.telefono;
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
}

function renderListaClientes() {
    const clientes = agruparPorCliente(todosFiados);
    const totalGeneral = clientes.reduce((s, c) => s + c.total, 0);
    const cont = document.getElementById('appContent');

    if (!clientes.length) {
        cont.innerHTML = '<div class="seccion"><div class="empty">🎉 No hay deuda pendiente registrada</div></div>';
        return;
    }

    let html = '<div class="seccion">';
    html += '<div class="resumen-global">' +
        '<div class="res-label">Deuda total pendiente</div>' +
        '<div class="res-total">' + fmt(totalGeneral) + '</div>' +
        '<div class="res-sub">' + clientes.length + ' cliente' + (clientes.length !== 1 ? 's' : '') + ' con deuda</div>' +
        '</div>';

    clientes.forEach(c => {
        const nombreEsc = encodeURIComponent(c.cliente);
        html += '<div class="cli-card' + (c.vencidos > 0 ? ' vencido' : '') + '" onclick="abrirCliente(\'' + nombreEsc + '\')">' +
            '<div>' +
                '<div class="cli-nombre">' + c.cliente + '</div>' +
                '<div class="cli-meta">' + c.cant + ' fiado' + (c.cant !== 1 ? 's' : '') + (c.telefono ? ' · ' + c.telefono : '') + '</div>' +
                (c.vencidos > 0 ? '<div class="cli-badge">' + c.vencidos + ' vencido' + (c.vencidos !== 1 ? 's' : '') + '</div>' : '') +
            '</div>' +
            '<div class="cli-monto">' + fmt(c.total) + '</div>' +
        '</div>';
    });
    html += '</div>';
    cont.innerHTML = html;
}

function volverALista() {
    clienteActual = null;
    cargarListaClientes();
}

// ========== DETALLE DE CLIENTE ==========
async function abrirCliente(nombreEsc) {
    const nombre = decodeURIComponent(nombreEsc);
    document.getElementById('btnVolverDetalle').style.display = '';
    document.getElementById('appContent').innerHTML =
        '<div class="loading"><div class="spinner"></div><div>Cargando cliente...</div></div>';
    try {
        const data = await _api('getFiadosCliente', { cliente: nombre });
        if (data.error) {
            document.getElementById('appContent').innerHTML =
                '<div class="loading" style="color:var(--rojo);">❌ ' + data.error + '</div>';
            return;
        }
        clienteActual = { cliente: data.cliente || nombre, telefono: data.telefono || '' };
        fiadosCliente = data.fiados || [];
        renderDetalleCliente(data);
    } catch (e) {
        document.getElementById('appContent').innerHTML =
            '<div class="loading" style="color:var(--rojo);">❌ Error al cargar. Verificá la conexión.</div>';
    }
}

function renderDetalleCliente(data) {
    const cont = document.getElementById('appContent');
    let html = '<div class="seccion">';
    html += '<div class="resumen-global">' +
        '<div class="res-label">' + clienteActual.cliente + '</div>' +
        '<div class="res-total">' + fmt(data.totalDeuda) + '</div>' +
        '<div class="res-sub">' + (data.cantFiados || 0) + ' fiado' + (data.cantFiados !== 1 ? 's' : '') +
            (data.hayVencidos ? ' · tiene vencidos' : '') +
            (clienteActual.telefono ? ' · ' + clienteActual.telefono : '') + '</div>' +
        '</div>';

    if (!fiadosCliente.length) {
        html += '<div class="empty">Sin fiados pendientes para este cliente</div>';
    } else {
        fiadosCliente.forEach(f => {
            const cls = f.estado === 'VENCIDO' ? 'vencido' : (f.abonadoParcial ? 'abonado' : '');
            const estadoTxt = f.estado === 'VENCIDO' ? 'Vencido' : (f.abonadoParcial ? 'Abonado parcial' : 'Pendiente');
            const estadoCls = f.estado === 'VENCIDO' ? 'vencido' : (f.abonadoParcial ? 'abonado' : 'pendiente');
            const ref = f.ticket ? ('Ticket #' + f.ticket) : f.idFiado;
            html += '<div class="fiado-card ' + cls + '" onclick="abrirModalPago(\'' + f.idFiado + '\')">' +
                '<div class="fiado-top"><span class="fiado-desc">' + (f.descripcion || ref) + '</span>' +
                '<span class="fiado-saldo">' + fmt(f.totalPendiente) + '</span></div>' +
                '<div class="fiado-meta">' + ref + ' · ' + (f.fecha || '').split(' ')[0] +
                    (f.fechaVencimiento ? ' · vence ' + f.fechaVencimiento : '') +
                    (f.abonadoParcial ? ' · abonado ' + fmt(f.montoAbonado) : '') + '</div>' +
                '<div class="fiado-estado ' + estadoCls + '">' + estadoTxt + '</div>' +
            '</div>';
        });
    }
    if (!GESTION_FIADOS) { // V7: P1 Esencial
        html += '<div class="ficha" id="fichaSencillo"><div class="mov-meta">🧾 <b>Fiado sencillo</b> (P1 Esencial): tocá un fiado para cobrarlo completo. Los pagos parciales, la ficha del cliente y los cobros recientes están en <b>P2 Gestión</b>.</div></div>';
        html += '</div>'; cont.innerHTML = html; return;
    }
    html += '<div class="ficha" id="fichaCliente"><div class="mov-meta">Cargando ficha del cliente…</div></div>'; // V6
    html += '</div>';
    cont.innerHTML = html;
    cargarFicha(); // V6
}

// ========== V6: FICHA DEL CLIENTE Y COBROS RECIENTES ==========
let fichaActual = null;
function _escF(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function cargarFicha(msg, tipo) {
    const box = document.getElementById('fichaCliente'); if (!box || !clienteActual) return;
    let r = null; try { r = await _api('getFichaCliente', { cliente: clienteActual.cliente, telefono: clienteActual.telefono }); } catch (e) { r = null; }
    if (!document.getElementById('fichaCliente')) return;
    if (!r) { box.innerHTML = '<div class="mov-meta">Sin conexión: no se pudo cargar la ficha. Los fiados de arriba están bien.</div>'; return; }
    if (/Acción no reconocida/i.test(r.error || '')) { box.innerHTML = '<div class="mov-meta">El servidor todavía no tiene la ficha del cliente (falta actualizarlo).</div>'; return; }
    if (!r.success) { box.innerHTML = '<div class="mov-meta">' + _escF(r.error || 'No se pudo cargar la ficha.') + '</div>'; return; }
    if (r.sinFicha || !r.clienteId) { box.innerHTML = '<div class="mov-meta">' + (r.migracionPendiente ? '⏳ Los fiados de este comercio se están actualizando: la ficha y los cobros recientes aparecen cuando VAO Sistemas termine la actualización.' : 'Este cliente todavía no tiene ficha.') + '</div>'; return; }
    fichaActual = r;
    let h = '<div class="ficha-top"><b>👤 ' + _escF(r.nombre) + (r.telefono ? ' · ' + _escF(r.telefono) : '') + '</b><span class="ficha-estado ' + (r.activo ? 'on' : 'off') + '">' + (r.activo ? 'Activo' : 'Desactivado') + '</span></div>' +
        '<div class="ficha-btns">' + (r.activo ? '<button class="btn-ficha-gris" onclick="gestionarCliente(\'desactivar\')">🚫 Desactivar</button>' : '<button class="btn-ficha-verde" onclick="gestionarCliente(\'reactivar\')">✅ Reactivar</button>') +
        '<button class="btn-ficha-rojo" onclick="gestionarCliente(\'eliminar\')">🗑 Eliminar</button></div>' +
        '<div class="ficha-msg" id="fichaMsg"></div>' +
        '<div style="font-size:0.72rem;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:1px;margin-top:12px;">📜 Cobros recientes</div>';
    r.movimientos = Array.isArray(r.movimientos) ? r.movimientos : [];
    if (!r.movimientos.length) h += '<div class="mov-meta" style="padding:6px 0;">Sin cobros registrados todavía.</div>';
    r.movimientos.forEach((m, i) => {
        h += '<div class="mov' + (m.anulado ? ' anulado' : '') + '"><div class="mov-top"><span>' + _escF(m.fecha) + ' · ' + _escF(m.medios.join(' + ') || (m.origen === 'MIGRACION' ? 'saldo anterior' : '')) + '</span><b>' + fmt(m.importe) + '</b></div>' +
             '<div class="mov-meta">' + _escF(m.idFiado) + (m.anulado ? ' · ANULADO: ' + _escF(m.motivoAnulacion) : '') + (m.origen === 'MIGRACION' ? ' · pagos anteriores a la actualización' : '') + '</div>' +
             (m.anulable ? '<div id="anu' + i + '"><button class="btn-mov" onclick="pedirAnulacion(' + i + ')">↩️ Anular</button></div>' : '') + '</div>';
    });
    box.innerHTML = h;
    if (msg) _fichaMsg(msg, tipo);
}
function _fichaMsg(t, tipo) { const m = document.getElementById('fichaMsg'); if (m) { m.className = 'ficha-msg ' + tipo; m.textContent = t; } }
async function gestionarCliente(accion) {
    if (!fichaActual) return;
    if (accion === 'eliminar' && fichaActual.tieneHistorial) { _fichaMsg('⚠️ ' + fichaActual.nombre + ' tiene fiados o pagos registrados, así que no se puede eliminar: podés desactivarlo, que conserva su historial.', 'aviso'); return; }
    let r = null; try { r = await _api('gestionarCliente', { accion: accion, clienteId: fichaActual.clienteId }); } catch (e) { r = null; }
    if (!r) { _fichaMsg('📡 Sin conexión. No se cambió nada: probá de nuevo.', 'error'); return; }
    if (!r.success) { _fichaMsg((r.tieneHistorial ? '⚠️ ' : '❌ ') + (r.error || 'No se pudo.'), r.tieneHistorial ? 'aviso' : 'error'); return; }
    if (accion === 'eliminar') { toast('✅ ' + r.mensaje, 'verde'); volverALista(); return; }
    await cargarFicha('✅ ' + r.mensaje, 'ok');
}
function pedirAnulacion(i) {
    const d = document.getElementById('anu' + i); if (!d) return;
    d.innerHTML = '<div class="mov-anular"><input id="motAnu' + i + '" maxlength="120" placeholder="Motivo (obligatorio)"><button onclick="confirmarAnulacion(' + i + ')">Confirmar</button></div>';
    document.getElementById('motAnu' + i).focus();
}
async function confirmarAnulacion(i) {
    const m = fichaActual && fichaActual.movimientos[i]; if (!m) return;
    const motivo = (document.getElementById('motAnu' + i).value || '').trim();
    if (!motivo) { _fichaMsg('Escribí el motivo de la anulación. No se anuló nada.', 'aviso'); return; }
    // El número de la anulación sale del abono: repetirla nunca la duplica.
    const opId = 'ANU-' + String(m.idMov).replace(/[^A-Za-z0-9_\-]/g, '').slice(-56);
    let r = null; try { r = await _api('anularAbono', { opId: opId, idMov: m.idMov, motivo: motivo }); } catch (e) { r = null; }
    if (!r) { _fichaMsg('📡 Sin respuesta. Si la anulación llegó, al reintentar no se repite: tocá Anular otra vez.', 'error'); return; }
    if (!r.success) { _fichaMsg('❌ ' + (r.error || 'No se pudo anular.'), 'error'); return; }
    toast('✅ ' + (r.mensaje || 'Abono anulado'), 'verde');
    await abrirClienteRefresh();
    await cargarFicha('✅ ' + r.mensaje + (r.devuelto && r.devuelto.length ? ' Devolver: ' + r.devuelto.map(x => x.medio + ' ' + fmt(x.importe)).join(' + ') + '.' : ''), 'ok');
}

// ========== MODAL DE PAGO (abono o cobro total de UN fiado) ==========
function abrirModalPago(idFiado) {
    fiadoSeleccionado = fiadosCliente.find(f => f.idFiado === idFiado);
    if (!fiadoSeleccionado) return;
    document.getElementById('pagoInfo').textContent =
        (fiadoSeleccionado.descripcion || fiadoSeleccionado.idFiado) + ' — saldo ' + fmt(fiadoSeleccionado.totalPendiente);
    document.getElementById('pagoMonto').value = fiadoSeleccionado.totalPendiente;
    document.getElementById('pagoError').style.display = 'none';
    seleccionarMetodoPago('efectivo');
    // V2: un pago enviado sin confirmar queda FIJO (mismo monto, método y número).
    const pend = _leerPagoPendiente();
    const esEste = !!(pend && pend.idFiado === idFiado);
    if (esEste) {
        document.getElementById('pagoMonto').value = pend.monto;
        seleccionarMetodoPago(pend.metodo);
    } else {
        const b = _leerBorradorPago();
        if (b && b.idFiado === idFiado) { document.getElementById('pagoMonto').value = b.monto; seleccionarMetodoPago(b.metodo || 'efectivo'); }
    }
    document.getElementById('pagoMonto').readOnly = esEste || !GESTION_FIADOS;
    if (!GESTION_FIADOS && !esEste) document.getElementById('pagoMonto').value = fiadoSeleccionado.totalPendiente; // V7: fiado sencillo = se cobra completo
    const nota = document.getElementById('pagoNotaPlan'); if (nota) nota.style.display = GESTION_FIADOS ? 'none' : 'block';
    document.getElementById('pagoPendienteAviso').style.display = esEste ? 'block' : 'none';
    document.getElementById('btnConfirmarPago').disabled = false;
    document.getElementById('btnConfirmarPago').textContent = '✅ Confirmar pago';
    document.getElementById('modalPago').classList.add('open');
}
function cerrarModalPago() { document.getElementById('modalPago').classList.remove('open'); }

function seleccionarMetodoPago(m) {
    // Solo cuando la ventana ya está abierta (al abrirla se arma sola).
    const abierta = document.getElementById('modalPago').classList.contains('open');
    const pend = _leerPagoPendiente();
    if (abierta && pend && fiadoSeleccionado && pend.idFiado === fiadoSeleccionado.idFiado && m !== pend.metodo) {
        toast('Pago enviado sin confirmar: no se puede cambiar el método', 'rojo'); return;
    }
    metodoPagoActual = m;
    if (abierta && fiadoSeleccionado && !pend) _guardarBorradorPago();
    ['efectivo', 'transferencia', 'debito', 'qr_posnet'].forEach(k => {
        const btn = document.getElementById('metodoPago-' + k);
        if (btn) btn.className = 'btn-metodo' + (k === m ? ' activo' : '');
    });
}

async function confirmarPago() {
    if (!fiadoSeleccionado) return;
    const errDiv = document.getElementById('pagoError');
    errDiv.style.display = 'none';
    // V2 (P0): el número de operación se crea UNA vez y se guarda ANTES de
    // enviar. Un reintento después de un corte usa el mismo número y los
    // mismos datos, así el servidor responde "ya existía" y no cobra dos veces.
    let pend = _leerPagoPendiente();
    if (pend && pend.idFiado !== fiadoSeleccionado.idFiado) {
        errDiv.textContent = '⚠️ Hay otro pago sin confirmar (' + (pend.cliente || '') + '). Resolvelo primero.';
        errDiv.style.display = 'block'; return;
    }
    if (!pend) {
        const montoEscrito = parseFloat(document.getElementById('pagoMonto').value) || 0;
        if (montoEscrito <= 0) { errDiv.textContent = '❌ Ingresá un monto válido'; errDiv.style.display = 'block'; return; }
        pend = {
            idOperacion: 'FVAO-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
            idFiado: fiadoSeleccionado.idFiado, monto: montoEscrito,
            esAbono: montoEscrito < fiadoSeleccionado.totalPendiente - 0.5,
            metodo: metodoPagoActual, cliente: clienteActual ? clienteActual.cliente : ''
        };
        _guardarPagoPendiente(pend);
    }
    const monto = pend.monto, esAbono = pend.esAbono, idOperacion = pend.idOperacion;
    metodoPagoActual = pend.metodo;
    const btn = document.getElementById('btnConfirmarPago');
    btn.disabled = true; btn.textContent = '⏳ Procesando...';

    try {
        let resp;
        if (esAbono) {
            resp = await _api('abonarFiado', { idFiado: fiadoSeleccionado.idFiado, abono: monto, metodoPago: metodoPagoActual, idOperacion });
        } else {
            resp = await _api('cobrarFiado', { idFiado: fiadoSeleccionado.idFiado, metodoPago: metodoPagoActual, idOperacion });
        }
        if (resp.success) {
            _borrarPagoPendiente(); _borrarBorradorPago();
            armarComprobante(monto, esAbono);
            cerrarModalPago();
            toast(resp.yaExistia ? '✅ Ese pago ya estaba registrado (no se cobró dos veces)' : '✅ Pago registrado', 'verde');
            await abrirClienteRefresh();
            abrirComprobante();
        } else {
            if (resp.definitivo || resp.moduloNoHabilitado) { _borrarPagoPendiente(); await abrirClienteRefresh(); } // V7: módulo no habilitado = no se escribió nada // p. ej. ya estaba saldado: no se escribió nada
            errDiv.textContent = '❌ ' + (resp.error || resp.mensaje || 'Error al registrar el pago') +
                (resp.definitivo ? '' : ' — el pago quedó guardado: Confirmar lo reintenta sin duplicar.');
            errDiv.style.display = 'block';
        }
    } catch (e) {
        errDiv.textContent = '📡 Sin respuesta del servidor. El pago quedó guardado en este equipo y no se va a cobrar dos veces: tocá Confirmar para reintentar.';
        errDiv.style.display = 'block';
        document.getElementById('pagoMonto').readOnly = true;
        document.getElementById('pagoPendienteAviso').style.display = 'block';
    }
    btn.disabled = false; btn.textContent = '✅ Confirmar pago';
}

async function abrirClienteRefresh() {
    if (!clienteActual) return;
    try {
        const data = await _api('getFiadosCliente', { cliente: clienteActual.cliente, telefono: clienteActual.telefono });
        if (!data.error) {
            fiadosCliente = data.fiados || [];
            renderDetalleCliente(data);
        }
    } catch (e) { /* si falla el refresco, el próximo "Volver" igual trae todo actualizado */ }
}

// ========== COMPROBANTE ==========
function armarComprobante(monto, esAbono) {
    const ref = fiadoSeleccionado.ticket ? ('Ticket #' + fiadoSeleccionado.ticket) : fiadoSeleccionado.idFiado;
    const metodoLabel = { efectivo: 'Efectivo', transferencia: 'Transferencia', debito: 'Débito', qr_posnet: 'QR / Posnet' }[metodoPagoActual] || metodoPagoActual;
    const restante = Math.max(0, fiadoSeleccionado.totalPendiente - monto);
    const lineas = [
        (esAbono ? '📋 *ABONO REGISTRADO*' : '✅ *PAGO REGISTRADO*'),
        '',
        '👤 Cliente: ' + clienteActual.cliente,
        '🧾 ' + ref,
        '💰 Monto: ' + fmt(monto),
        (esAbono ? '📋 Saldo restante: ' + fmt(restante) : '✅ Deuda saldada'),
        '💳 Método: ' + metodoLabel
    ];
    ultimoComprobante = lineas.join('\n');
}

function abrirComprobante() {
    document.getElementById('comprobanteTexto').textContent = ultimoComprobante;
    document.getElementById('copiadoMsg').style.display = 'none';
    document.getElementById('modalComprobante').classList.add('open');
}

// ===== V45.2 — REGLA DE ORO (dueño, 13/11/2026): WhatsApp abre PRIMERO WhatsApp Business; si no está, WhatsApp común =====
// · Número en formato internacional argentino: 54 + 9 + característica + número (sin 0 ni 15). Ej.: «0294 15 4907380» → 5492944907380.
// · Android: se pide WhatsApp Business (com.whatsapp.w4b); si no está instalado, el mismo pedido sigue por el enlace web,
//   que abre WhatsApp común. iPhone y computadora: enlace web (ahí no se puede elegir la aplicación).
function _telWaVAO_(t) {
    var d = String(t || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.indexOf('00') === 0) d = d.slice(2);
    if (d.indexOf('549') === 0 && d.length === 13) return d;
    if (d.indexOf('54') === 0 && d.length === 12) return '549' + d.slice(2);   // celular argentino sin el 9
    if (d.charAt(0) === '0') d = d.slice(1);
    if (d.length === 12) { for (var k = 2; k <= 4; k++) if (d.substr(k, 2) === '15') { d = d.slice(0, k) + d.slice(k + 2); break; } }   // característica + 15 + número
    if (d.length === 10) return '549' + d;
    return d;   // otro país (por ejemplo Chile 569…): tal cual
}
function _urlWaVAO_(tel, texto) { var n = _telWaVAO_(tel); return 'https://wa.me/' + n + (texto ? '?text=' + encodeURIComponent(texto) : ''); }
function abrirWhatsAppVAO(tel, texto) {
    var web = _urlWaVAO_(tel, texto);
    if (/Android/i.test(navigator.userAgent || '')) {
        var n = _telWaVAO_(tel), q = (n ? 'phone=' + n : '') + (texto ? (n ? '&' : '') + 'text=' + encodeURIComponent(texto) : '');
        window.open('intent://send/?' + q + '#Intent;scheme=whatsapp;package=com.whatsapp.w4b;S.browser_fallback_url=' + encodeURIComponent(web) + ';end', '_blank');
        return;
    }
    window.open(web, '_blank', 'noopener');
}
// Cualquier enlace https://wa.me/… de la página pasa por la misma regla.
document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href^="https://wa.me/"]') : null; if (!a) return;
    e.preventDefault(); var u = new URL(a.href); abrirWhatsAppVAO(u.pathname.replace(/\//g, ''), u.searchParams.get('text') || '');
}, true);
function cerrarComprobante() { document.getElementById('modalComprobante').classList.remove('open'); }

function compartirComprobante() {
    if (!ultimoComprobante) return;
    if (navigator.share) { navigator.share({ text: ultimoComprobante }).catch(() => {}); }
    else { abrirWhatsAppVAO('', ultimoComprobante); }   // V7.1
}
function copiarComprobante() {
    if (!ultimoComprobante) return;
    const msg = document.getElementById('copiadoMsg');
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ultimoComprobante).then(() => { msg.style.display = 'block'; });
    } else {
        const ta = document.createElement('textarea');
        ta.value = ultimoComprobante; ta.style.cssText = 'position:fixed;top:-9999px';
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { document.execCommand('copy'); msg.style.display = 'block'; } catch (e) {}
        document.body.removeChild(ta);
    }
}

init();

// ========== V2: pago de fiado enviado sin confirmar ==========
function _pagoKey() { return 'vao_pago_fiado_en_curso_' + PREFIJO; }
function _leerPagoPendiente() { try { return JSON.parse(localStorage.getItem(_pagoKey()) || 'null'); } catch (e) { return null; } }
function _guardarPagoPendiente(p) { try { localStorage.setItem(_pagoKey(), JSON.stringify(Object.assign({ hora: Date.now() }, p))); } catch (e) {} }
function _borrarPagoPendiente() { try { localStorage.removeItem(_pagoKey()); } catch (e) {} }
// Borrador del monto/método mientras se escribe (sin datos sensibles).
function _borradorPagoKey() { return 'vao_borrador_pago_fiado_' + PREFIJO; }
function _leerBorradorPago() { try { return JSON.parse(localStorage.getItem(_borradorPagoKey()) || 'null'); } catch (e) { return null; } }
function _guardarBorradorPago() {
    if (!fiadoSeleccionado) return;
    try { localStorage.setItem(_borradorPagoKey(), JSON.stringify({ idFiado: fiadoSeleccionado.idFiado, monto: document.getElementById('pagoMonto').value, metodo: metodoPagoActual })); } catch (e) {}
}
function _borrarBorradorPago() { try { localStorage.removeItem(_borradorPagoKey()); } catch (e) {} }
document.getElementById('pagoMonto').addEventListener('input', function () { if (!_leerPagoPendiente()) _guardarBorradorPago(); });

function descartarPagoPendiente() {
    const p = _leerPagoPendiente(); if (!p) return;
    if (!confirm('¿Descartar el pago sin confirmar de ' + fmt(p.monto) + '?\n\nSi ya había llegado al servidor, quedará registrado.')) return;
    _borrarPagoPendiente();
    document.getElementById('pagoMonto').readOnly = false;
    document.getElementById('pagoPendienteAviso').style.display = 'none';
}

// Al entrar: se pregunta al servidor (solo lectura) si el pago pendiente llegó.
async function verificarPagoPendiente() {
    const p = _leerPagoPendiente(); if (!p) return;
    try {
        const r = await _api('verificarOperacion', { tipo: 'pagoFiado', id: p.idOperacion, idFiado: p.idFiado });
        if (r && r.success && r.existe) {
            _borrarPagoPendiente(); _borrarBorradorPago();
            toast('✅ El pago que había quedado sin confirmar (' + fmt(p.monto) + ') ya estaba registrado', 'verde');
            await cargarListaClientes();
        } else if (r && r.success) {
            toast('⚠️ Hay un pago sin confirmar de ' + (p.cliente || '') + ' (' + fmt(p.monto) + '): abrí su cuenta y tocá Confirmar', 'rojo');
        }
    } catch (e) {}
}

// ========== V2: el botón Atrás del celular cierra la ventana o vuelve a la lista ==========
let _nivelHistorial = 0, _ignorarPopF = false;
function _estadoPantalla() {
    if (document.querySelector('.modal-bg.open')) return 2;
    return document.getElementById('btnVolverDetalle').style.display === '' ? 1 : 0;
}
new MutationObserver(function () {
    const nivel = _estadoPantalla();
    while (_nivelHistorial < nivel) { history.pushState({ vaoNivel: _nivelHistorial + 1 }, ''); _nivelHistorial++; }
    if (_nivelHistorial > nivel) { const n = _nivelHistorial - nivel; _nivelHistorial = nivel; _ignorarPopF = true; history.go(-n); }
}).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class', 'style'] });
window.addEventListener('popstate', function () {
    if (_ignorarPopF) { _ignorarPopF = false; return; }
    _nivelHistorial = Math.max(0, _nivelHistorial - 1);
    const abierto = document.querySelector('.modal-bg.open');
    if (abierto) { abierto.id === 'modalComprobante' ? cerrarComprobante() : cerrarModalPago(); return; }
    if (document.getElementById('btnVolverDetalle').style.display === '') volverALista();
});
</script>
